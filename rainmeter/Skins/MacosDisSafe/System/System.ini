[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@Include=#@#Variables.inc
OnRefreshAction=[!KeepOnScreen "1"]

[Metadata]
Name=macos_dis System
Author=homesweetlove
Information=CPU RAM disk and network widget
Version=0.3

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureRAM]
Measure=PhysicalMemory

[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1

[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,230,185,24 | Fill Color #GlassColor# | StrokeWidth 1 | Stroke Color #GlassBorder#

[StyleLabel]
Meter=String
FontFace=#FontFace#
FontColor=#TextMuted#
FontSize=9
AntiAlias=1

[StyleValue]
Meter=String
FontFace=#FontFace#
FontColor=#TextColor#
FontSize=10
StringStyle=Bold
AntiAlias=1
StringAlign=Right

[MeterTitle]
Meter=String
X=18
Y=15
Text=SYSTEM
FontFace=#FontFace#
FontColor=#TextColor#
FontSize=11
StringStyle=Bold
AntiAlias=1

[MeterCPUText]
Meter=String
MeterStyle=StyleLabel
X=18
Y=45
Text=CPU

[MeterCPUValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPU
X=212
Y=45
Text=%1%

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
X=18
Y=64
W=194
H=4
BarColor=#Accent#
SolidColor=255,255,255,22
BarOrientation=Horizontal

[MeterRAMText]
Meter=String
MeterStyle=StyleLabel
X=18
Y=78
Text=MEMORY

[MeterRAMValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureRAM
X=212
Y=78
Text=%1%
Percentual=1

[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
X=18
Y=97
W=194
H=4
BarColor=#Accent#
SolidColor=255,255,255,22
BarOrientation=Horizontal

[MeterDiskText]
Meter=String
MeterStyle=StyleLabel
X=18
Y=111
Text=DISK C:

[MeterDiskValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureDisk
X=212
Y=111
Text=%1%
Percentual=1

[MeterDiskBar]
Meter=Bar
MeasureName=MeasureDisk
X=18
Y=130
W=194
H=4
BarColor=#Accent#
SolidColor=255,255,255,22
BarOrientation=Horizontal

[MeterNetwork]
Meter=String
MeasureName=MeasureNetIn
MeasureName2=MeasureNetOut
X=18
Y=150
FontFace=#FontFace#
FontColor=#TextMuted#
FontSize=9
AntiAlias=1
AutoScale=1
NumOfDecimals=1
Text=IN %1B/s    OUT %2B/s
