[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@Include=#@#Variables.inc
OnRefreshAction=[!KeepOnScreen "1"]

[Metadata]
Name=macos_dis Dock
Author=homesweetlove
Information=Stable image-based launcher dock
Version=0.3

[MeterDock]
Meter=Shape
Shape=Rectangle 0,0,356,76,22 | Fill Color #GlassColor# | StrokeWidth 1 | Stroke Color #GlassBorder#

[StyleIcon]
Meter=Image
W=52
H=52
Y=12
PreserveAspectRatio=1
AntiAlias=1
ImageAlpha=255
MouseOverAction=[!SetOption #CURRENTSECTION# ImageAlpha "210"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# ImageAlpha "255"][!UpdateMeter #CURRENTSECTION#][!Redraw]

[MeterExplorer]
Meter=Image
MeterStyle=StyleIcon
X=12
ImageName=#@#Images\explorer.png
LeftMouseUpAction=#ExplorerCommand#
ToolTipText=Explorer

[MeterBrowser]
Meter=Image
MeterStyle=StyleIcon
X=80
ImageName=#@#Images\browser.png
LeftMouseUpAction=#BrowserCommand#
ToolTipText=Browser

[MeterTerminal]
Meter=Image
MeterStyle=StyleIcon
X=148
ImageName=#@#Images\terminal.png
LeftMouseUpAction=#TerminalCommand#
ToolTipText=Terminal

[MeterSettings]
Meter=Image
MeterStyle=StyleIcon
X=216
ImageName=#@#Images\settings.png
LeftMouseUpAction=#SettingsCommand#
ToolTipText=Settings

[MeterTrash]
Meter=Image
MeterStyle=StyleIcon
X=284
ImageName=#@#Images\trash.png
LeftMouseUpAction=#RecycleCommand#
ToolTipText=Recycle Bin
