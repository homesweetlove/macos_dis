[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@Include=#@#Variables.inc
OnRefreshAction=[!SetWindowPosition "0" "0" "0" "0"][!ZPos "2"][!Draggable "0"][!KeepOnScreen "1"][!SnapEdges "0"]

[Metadata]
Name=macos_dis Menu Bar
Author=homesweetlove
Information=Stable macOS-style top bar
Version=0.3

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%a %b %d

[MeterBackground]
Meter=Shape
X=8
Y=6
Shape=Rectangle 0,0,(#SCREENAREAWIDTH#-16),#MenuHeight#,12 | Fill Color #GlassColor# | StrokeWidth 1 | Stroke Color #GlassBorder#
DynamicVariables=1

[StyleMenu]
Meter=String
FontFace=#FontFace#
FontColor=#TextColor#
FontSize=10
AntiAlias=1
StringAlign=LeftCenter
Y=23

[MeterBrand]
Meter=String
MeterStyle=StyleMenu
X=22
Text=macos_dis
StringStyle=Bold

[MeterFinder]
Meter=String
MeterStyle=StyleMenu
X=96
Text=Finder
StringStyle=Bold
LeftMouseUpAction=#ExplorerCommand#
ToolTipText=Open Explorer

[MeterFile]
Meter=String
MeterStyle=StyleMenu
X=146
Text=File

[MeterEdit]
Meter=String
MeterStyle=StyleMenu
X=178
Text=Edit

[MeterView]
Meter=String
MeterStyle=StyleMenu
X=211
Text=View

[MeterGo]
Meter=String
MeterStyle=StyleMenu
X=247
Text=Go

[MeterWindow]
Meter=String
MeterStyle=StyleMenu
X=276
Text=Window

[MeterHelp]
Meter=String
MeterStyle=StyleMenu
X=329
Text=Help

[MeterStatus]
Meter=String
MeasureName=MeasureDate
MeasureName2=MeasureTime
FontFace=#FontFace#
FontColor=#TextColor#
FontSize=9
AntiAlias=1
StringAlign=RightCenter
X=(#SCREENAREAWIDTH#-23)
Y=23
Text=WiFi   %1   %2
DynamicVariables=1
