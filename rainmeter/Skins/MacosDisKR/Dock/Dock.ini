[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
KeepOnScreen=1
Draggable=1

[Metadata]
Name=macos_dis KR Dock
Author=homesweetlove
Information=macOS 스타일 Rainmeter 런처 Dock
Version=0.1

@Include=#@#Variables.inc

[MeterDock]
Meter=Shape
Shape=Rectangle 0,0,356,70,22 | Fill Color #GlassColor# | StrokeWidth 1 | Stroke Color #GlassBorder#

[StyleIconBox]
Meter=Shape
Y=9
Shape=Rectangle 0,0,50,50,14 | Fill Color 255,255,255,24 | StrokeWidth 1 | Stroke Color 255,255,255,24
MouseOverAction=[!SetOption #CURRENTSECTION# Shape "Rectangle 0,0,50,50,14 | Fill Color 255,255,255,54 | StrokeWidth 1 | Stroke Color 255,255,255,45"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# Shape "Rectangle 0,0,50,50,14 | Fill Color 255,255,255,24 | StrokeWidth 1 | Stroke Color 255,255,255,24"][!UpdateMeter #CURRENTSECTION#][!Redraw]

[StyleGlyph]
Meter=String
Y=34
W=50
H=50
StringAlign=CenterCenter
FontFace=Segoe UI Symbol
FontColor=#TextColor#
FontSize=20
AntiAlias=1

[MeterFinderBox]
Meter=Shape
MeterStyle=StyleIconBox
X=10
LeftMouseUpAction=#ExplorerCommand#
ToolTipText=Finder / 파일 탐색기

[MeterFinder]
Meter=String
MeterStyle=StyleGlyph
X=35
Text=▣
LeftMouseUpAction=#ExplorerCommand#

[MeterBrowserBox]
Meter=Shape
MeterStyle=StyleIconBox
X=68
LeftMouseUpAction=#BrowserCommand#
ToolTipText=브라우저

[MeterBrowser]
Meter=String
MeterStyle=StyleGlyph
X=93
Text=◎
LeftMouseUpAction=#BrowserCommand#

[MeterTerminalBox]
Meter=Shape
MeterStyle=StyleIconBox
X=126
LeftMouseUpAction=#TerminalCommand#
ToolTipText=터미널

[MeterTerminal]
Meter=String
MeterStyle=StyleGlyph
X=151
Text=>_
FontSize=14
LeftMouseUpAction=#TerminalCommand#

[MeterSettingsBox]
Meter=Shape
MeterStyle=StyleIconBox
X=184
LeftMouseUpAction=#SettingsCommand#
ToolTipText=설정

[MeterSettings]
Meter=String
MeterStyle=StyleGlyph
X=209
Text=⚙
LeftMouseUpAction=#SettingsCommand#

[MeterSeparator]
Meter=Shape
X=246
Y=16
Shape=Line 0,0,0,38 | StrokeWidth 1 | Stroke Color 255,255,255,45

[MeterTrashBox]
Meter=Shape
MeterStyle=StyleIconBox
X=262
LeftMouseUpAction=#RecycleCommand#
ToolTipText=휴지통

[MeterTrash]
Meter=String
MeterStyle=StyleGlyph
X=287
Text=♲
LeftMouseUpAction=#RecycleCommand#

[MeterHint]
Meter=String
X=324
Y=35
StringAlign=CenterCenter
FontFace=#FontFace#
FontColor=#TextMuted#
FontSize=8
AntiAlias=1
Text=KR
ToolTipText=명령은 @Resources\Variables.inc 에서 수정
