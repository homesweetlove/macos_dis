[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@Include=#@#Variables.inc
OnRefreshAction=[!SetWindowPosition "50%" "50%" "50%" "50%"][!KeepOnScreen "1"]

[Metadata]
Name=macos_dis KR Setup
Author=homesweetlove
Information=Rainmeter 스킨 빠른 실행 패널
Version=0.1

[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,300,210,24 | Fill Color #GlassColor# | StrokeWidth 1 | Stroke Color #GlassBorder#

[MeterTitle]
Meter=String
X=20
Y=18
Text=macos_dis KR
FontFace=#FontFace#
FontColor=#TextColor#
FontSize=16
StringStyle=Bold
AntiAlias=1

[MeterSub]
Meter=String
X=20
Y=46
Text=Rainmeter 데스크톱 세트
FontFace=#FontFace#
FontColor=#TextMuted#
FontSize=9
AntiAlias=1

[StyleButton]
Meter=String
X=20
W=260
H=32
SolidColor=255,255,255,22
FontFace=#FontFace#
FontColor=#TextColor#
FontSize=10
StringStyle=Bold
AntiAlias=1
StringAlign=CenterCenter
MouseOverAction=[!SetOption #CURRENTSECTION# SolidColor "255,255,255,45"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# SolidColor "255,255,255,22"][!UpdateMeter #CURRENTSECTION#][!Redraw]

[MeterLoadAll]
Meter=String
MeterStyle=StyleButton
Y=78
Text=전체 불러오기 + 추천 배치
LeftMouseUpAction=[!ActivateConfig "MacosDisKR\MenuBar" "MenuBar.ini"][!ActivateConfig "MacosDisKR\Clock" "Clock.ini"][!ActivateConfig "MacosDisKR\System" "System.ini"][!ActivateConfig "MacosDisKR\Dock" "Dock.ini"][!Delay 250][!SetWindowPosition "0" "0" "0" "0" "MacosDisKR\MenuBar"][!SetWindowPosition "24R" "58" "100%" "0" "MacosDisKR\Clock"][!SetWindowPosition "24R" "196" "100%" "0" "MacosDisKR\System"][!SetWindowPosition "50%" "16B" "50%" "100%" "MacosDisKR\Dock"]

[MeterRefreshAll]
Meter=String
MeterStyle=StyleButton
Y=118
Text=전체 새로고침
LeftMouseUpAction=[!RefreshApp]

[MeterEdit]
Meter=String
MeterStyle=StyleButton
Y=158
Text=런처 설정 열기
LeftMouseUpAction=["#CONFIGEDITOR#" "#@#Variables.inc"]

[MeterFoot]
Meter=String
X=150
Y=197
StringAlign=CenterCenter
Text=설치 후 이 패널에서 시작하세요
FontFace=#FontFace#
FontColor=#TextMuted#
FontSize=8
AntiAlias=1
