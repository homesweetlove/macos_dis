[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@Include=#@#Variables.inc
OnRefreshAction=[!SetWindowPosition "50%" "50%" "50%" "50%"][!KeepOnScreen "1"]

[Metadata]
Name=macos_dis KR Setup
Author=homesweetlove
Information=Rainmeter 스킨 빠른 실행 및 테마 패널
Version=0.2

[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,300,300,24 | Fill Color #GlassColor# | StrokeWidth 1 | Stroke Color #GlassBorder#

[MeterTitle]
Meter=String
X=20
Y=18
Text=macos_dis KR
FontFace=#FontFace#
FontColor=#TextColor#
FontSize=16
StringStyle=Bold
AntiAlias=1

[MeterSub]
Meter=String
X=20
Y=46
Text=Rainmeter 데스크톱 세트
FontFace=#FontFace#
FontColor=#TextMuted#
FontSize=9
AntiAlias=1

[StyleButton]
Meter=String
X=20
W=260
H=32
SolidColor=255,255,255,22
FontFace=#FontFace#
FontColor=#TextColor#
FontSize=10
StringStyle=Bold
AntiAlias=1
StringAlign=CenterCenter
MouseOverAction=[!SetOption #CURRENTSECTION# SolidColor "255,255,255,45"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# SolidColor "255,255,255,22"][!UpdateMeter #CURRENTSECTION#][!Redraw]

[MeterLoadAll]
Meter=String
MeterStyle=StyleButton
Y=76
Text=전체 불러오기 + 추천 배치
LeftMouseUpAction=[!ActivateConfig "MacosDisKR\MenuBar" "MenuBar.ini"][!ActivateConfig "MacosDisKR\Clock" "Clock.ini"][!ActivateConfig "MacosDisKR\System" "System.ini"][!ActivateConfig "MacosDisKR\Dock" "Dock.ini"][!Delay 250][!SetWindowPosition "0" "0" "0" "0" "MacosDisKR\MenuBar"][!SetWindowPosition "24R" "58" "100%" "0" "MacosDisKR\Clock"][!SetWindowPosition "24R" "196" "100%" "0" "MacosDisKR\System"][!SetWindowPosition "50%" "16B" "50%" "100%" "MacosDisKR\Dock"]

[MeterDark]
Meter=String
MeterStyle=StyleButton
Y=116
Text=다크 글래스
LeftMouseUpAction=[!WriteKeyValue Variables GlassColor "26,30,38,205" "#@#Variables.inc"][!WriteKeyValue Variables GlassColorSoft "35,40,50,180" "#@#Variables.inc"][!WriteKeyValue Variables TextColor "245,247,250,245" "#@#Variables.inc"][!WriteKeyValue Variables TextMuted "245,247,250,150" "#@#Variables.inc"][!WriteKeyValue Variables GlassBorder "255,255,255,38" "#@#Variables.inc"][!RefreshApp]

[MeterLight]
Meter=String
MeterStyle=StyleButton
Y=156
Text=라이트 글래스
LeftMouseUpAction=[!WriteKeyValue Variables GlassColor "245,248,255,210" "#@#Variables.inc"][!WriteKeyValue Variables GlassColorSoft "245,248,255,180" "#@#Variables.inc"][!WriteKeyValue Variables TextColor "24,30,40,245" "#@#Variables.inc"][!WriteKeyValue Variables TextMuted "24,30,40,150" "#@#Variables.inc"][!WriteKeyValue Variables GlassBorder "255,255,255,100" "#@#Variables.inc"][!RefreshApp]

[MeterRefreshAll]
Meter=String
MeterStyle=StyleButton
Y=196
Text=전체 새로고침
LeftMouseUpAction=[!RefreshApp]

[MeterEdit]
Meter=String
MeterStyle=StyleButton
Y=236
Text=런처 / 색상 직접 편집
LeftMouseUpAction=["#CONFIGEDITOR#" "#@#Variables.inc"]

[MeterFoot]
Meter=String
X=150
Y=284
StringAlign=CenterCenter
Text=설치 후 이 패널에서 시작하세요
FontFace=#FontFace#
FontColor=#TextMuted#
FontSize=8
AntiAlias=1
