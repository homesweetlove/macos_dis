[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@Include=#@#Variables.inc
OnRefreshAction=[!KeepOnScreen "1"]

[Metadata]
Name=macos_dis KR Clock
Author=homesweetlove
Information=한국어 macOS 스타일 시계/날짜 위젯
Version=0.1

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureSeconds]
Measure=Time
Format=%S

[MeasureDateKR]
Measure=Script
ScriptFile=#@#Scripts\DateKR.lua

[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,230,126,24 | Fill Color #GlassColor# | StrokeWidth 1 | Stroke Color #GlassBorder#

[MeterLabel]
Meter=String
X=18
Y=15
Text=오늘
FontFace=#FontFace#
FontColor=#TextMuted#
FontSize=9
StringStyle=Bold
AntiAlias=1

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=17
Y=34
FontFace=#FontFace#
FontColor=#TextColor#
FontSize=31
StringStyle=Bold
AntiAlias=1
Text=%1

[MeterSeconds]
Meter=String
MeasureName=MeasureSeconds
X=178
Y=49
FontFace=#FontFace#
FontColor=#TextMuted#
FontSize=10
AntiAlias=1
Text=:%1

[MeterDate]
Meter=String
MeasureName=MeasureDateKR
X=18
Y=91
FontFace=#FontFace#
FontColor=#TextColor#
FontSize=11
AntiAlias=1
Text=%1
