[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@Include=#@#Variables.inc
OnRefreshAction=[!SetWindowPosition "0" "0" "0" "0"][!ZPos "2"][!Draggable "0"][!KeepOnScreen "1"][!SnapEdges "0"]

[Metadata]
Name=macos_dis KR Menu Bar
Author=homesweetlove
Information=한국어 macOS 스타일 상단 메뉴바
Version=0.1

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDateKR]
Measure=Script
ScriptFile=#@#Scripts\DateKR.lua

[MeterBackground]
Meter=Shape
X=8
Y=6
Shape=Rectangle 0,0,(#SCREENAREAWIDTH#-16),#MenuHeight#,12 | Fill Color #GlassColor# | StrokeWidth 1 | Stroke Color #GlassBorder#
DynamicVariables=1

[StyleMenu]
Meter=String
FontFace=#FontFace#
FontColor=#TextColor#
FontSize=10
AntiAlias=1
StringAlign=LeftCenter
Y=23

[MeterApple]
Meter=String
MeterStyle=StyleMenu
X=22
Text=◆
FontSize=9

[MeterFinder]
Meter=String
MeterStyle=StyleMenu
X=43
Text=Finder
StringStyle=Bold
LeftMouseUpAction=#ExplorerCommand#
ToolTipText=파일 탐색기 열기

[MeterFile]
Meter=String
MeterStyle=StyleMenu
X=94
Text=파일

[MeterEdit]
Meter=String
MeterStyle=StyleMenu
X=129
Text=편집

[MeterView]
Meter=String
MeterStyle=StyleMenu
X=164
Text=보기

[MeterGo]
Meter=String
MeterStyle=StyleMenu
X=199
Text=이동

[MeterWindow]
Meter=String
MeterStyle=StyleMenu
X=234
Text=윈도우

[MeterHelp]
Meter=String
MeterStyle=StyleMenu
X=283
Text=도움말

[MeterStatus]
Meter=String
FontFace=#FontFace#
FontColor=#TextColor#
FontSize=9
AntiAlias=1
StringAlign=RightCenter
X=(#SCREENAREAWIDTH#-23)
Y=23
Text=⌃  Wi-Fi   [MeasureDateKR]   [MeasureTime]
DynamicVariables=1
